<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2864dc">
  <title>캠퍼스몽 · 연결 확인</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f6fa;color:#26364c;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}.card{width:min(100%,430px);padding:34px 28px;background:#fff;border:1px solid #dfe5ee;border-radius:16px;text-align:center;box-shadow:0 10px 30px #233c5f12}.icon{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 20px;border-radius:18px;background:#2864dc;color:#fff;font-size:30px;font-weight:800}h1{margin:0 0 10px;font-size:24px;color:#223653}p{margin:0 0 24px;color:#6b7b91;line-height:1.7}button{min-height:46px;padding:10px 20px;border:0;border-radius:8px;background:#2864dc;color:#fff;font:inherit;font-weight:700;cursor:pointer}
  </style>
</head>
<body><main class="card"><div class="icon">몽</div><h1>인터넷 연결을 확인해 주세요</h1><p>연결이 복구되면 근무표를 다시 불러올 수 있습니다.</p><button onclick="location.reload()">다시 연결</button></main></body>
</html>
